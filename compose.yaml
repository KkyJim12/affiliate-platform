services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: unxo
      POSTGRES_PASSWORD: unxo_local_dev
      POSTGRES_DB: unxo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - unxo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unxo -d unxo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  unxo_postgres:
